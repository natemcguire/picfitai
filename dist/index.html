<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PicFit.ai - AI Virtual Try-On</title>
    <meta name="description" content="Try on outfits virtually with AI. Upload your photos and see how clothes look on you before buying.">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f7 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .main-container {
            max-width: 768px;
            margin: 0 auto;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f7 100%);
            position: relative;
        }

        @media (max-width: 768px) {
            .main-container {
                max-width: 100%;
            }
        }

        
    .header-nav {
        position: fixed;
        top: 15px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 10px 20px;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .logo {
        font-size: 28px;
        font-weight: 700;
        font-family: 'Fredoka One', cursive;
        background: linear-gradient(45deg, #ff6b9d, #4ecdc4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
        text-shadow: 0 4px 8px rgba(255, 107, 157, 0.2);
    }

    .nav-buttons {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .nav-btn {
        padding: 12px 24px;
        background: linear-gradient(45deg, #ff6b9d 0%, #ff8fab 50%, #ff6b9d 100%);
        color: white;
        text-decoration: none;
        border-radius: 50px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 6px 20px rgba(255, 107, 157, 0.3);
        transition: all 0.3s ease;
        border: 2px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
    }

    .nav-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
        background: linear-gradient(45deg, #ff8fab 0%, #ffafc9 50%, #ff8fab 100%);
    }

    .nav-btn.secondary {
        background: linear-gradient(45deg, #4ecdc4 0%, #44a08d 50%, #4ecdc4 100%);
        box-shadow: 0 6px 20px rgba(78, 205, 196, 0.3);
    }

    .nav-btn.secondary:hover {
        background: linear-gradient(45deg, #5fd8cf 0%, #4ecdc4 50%, #5fd8cf 100%);
        box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
    }


        .gallery-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            opacity: 0.3;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            align-content: flex-start;
            overflow: hidden;
        }

        .gallery-item {
            width: 200px;
            height: 300px;
            border-radius: 15px;
            object-fit: cover;
            filter: blur(2px) grayscale(30%);
            transform: rotate(-5deg);
        }

        .gallery-item:nth-child(even) {
            transform: rotate(3deg);
        }

        .gallery-item:nth-child(3n) {
            transform: rotate(-2deg);
        }

        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            margin-bottom: 100px;
            margin-top: 40px;
        }

        .featured-container {
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .featured-container:hover {
            transform: scale(1.02);
        }

        .featured-photo {
            background: white;
            padding: 20px 20px 60px 20px;
            border-radius: 20px;
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.8),
                0 0 0 6px rgba(255, 182, 193, 0.4),
                0 8px 32px rgba(255, 107, 157, 0.3),
                0 16px 64px rgba(255, 107, 157, 0.2);
            transform: rotate(-1deg);
            max-width: 400px;
            margin: 0 auto;
            position: relative;
        }

        .featured-photo img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }

        .rate-button {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #ff6b9d, #ff8fab);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(255, 107, 157, 0.3);
        }

        .rate-button:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
            background: linear-gradient(45deg, #ff8fab, #ffafc9);
        }

        .title {
            position: relative;
            text-align: center;
            z-index: 15;
            width: 100%;
            max-width: 600px;
            margin: 80px auto 30px auto;
            padding: 0 20px;
        }

        .title h1 {
            font-size: 3rem;
            font-weight: 700;
            font-family: 'Fredoka One', cursive;
            background: linear-gradient(45deg, #ff6b9d, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 8px rgba(255, 107, 157, 0.2);
            margin-bottom: 0.5rem;
        }

        .title p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            margin: 0 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b9d, #ff8fab);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.6);
        }

        .btn-secondary {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
        }

        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.6);
        }
    </style>
</head>
<body>
    <div class="main-container">
        
<div class="header-nav">
    <a href="/" class="logo">PicFit.ai</a>
    <div class="nav-buttons">
        <a href="/pricing.html" class="nav-btn secondary">Pricing</a>
        <a href="/generate.html" class="nav-btn">Get Started</a>
    </div>
</div>


        <!-- Gallery Background -->
        <div class="gallery-background">
            <img src="/images/IMG_2707.jpeg" alt="Outfit 1" class="gallery-item" />
            <img src="/images/IMG_2912.jpeg" alt="Outfit 2" class="gallery-item" />
            <img src="/images/IMG_2917.jpeg" alt="Outfit 3" class="gallery-item" />
            <img src="/images/IMG_3531.jpeg" alt="Outfit 4" class="gallery-item" />
            <img src="/images/outfits/Blue Suit.png" alt="Outfit 5" class="gallery-item" />
            <img src="/images/outfits/Tux.png" alt="Outfit 6" class="gallery-item" />
            <img src="/images/outfits/Astronaut.png" alt="Outfit 7" class="gallery-item" />
            <img src="/images/outfits/Wedding.png" alt="Outfit 8" class="gallery-item" />
            <img src="/images/outfits/Casual Girl.png" alt="Outfit 9" class="gallery-item" />
            <img src="/images/outfits/Cinderellla.png" alt="Outfit 10" class="gallery-item" />
            <img src="/images/IMG_2707.jpeg" alt="Outfit 11" class="gallery-item" />
            <img src="/images/IMG_2912.jpeg" alt="Outfit 12" class="gallery-item" />
            <img src="/images/IMG_2917.jpeg" alt="Outfit 13" class="gallery-item" />
            <img src="/images/IMG_3531.jpeg" alt="Outfit 14" class="gallery-item" />
            <img src="/images/outfits/Blue Suit.png" alt="Outfit 15" class="gallery-item" />
            <img src="/images/outfits/Tux.png" alt="Outfit 16" class="gallery-item" />
        </div>

        <!-- Title -->
        <div class="title">
            <h1>PicFit.ai</h1>
            <p>Try on outfits with AI</p>
            <div>
                <a href="/generate.html" class="btn btn-primary">Get Started</a>
                <a href="/pricing.html" class="btn btn-secondary">Pricing</a>
            </div>
        </div>

        <!-- Main Featured Photo -->
        <div class="main-content">
            <div class="featured-container" onclick="window.location.href='/generate.html'">
                <div class="featured-photo">
                    <img src="/images/person.png" alt="Latest AI-generated outfit" />
                    <button class="rate-button" onclick="event.stopPropagation(); window.location.href='/generate.html';">Rate This Fit</button>
                </div>
            </div>
        </div>

        <!-- Simple Footer -->
        <footer style="position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 20;">
            <p style="color: #666; font-size: 0.9rem; background: rgba(255, 255, 255, 0.8); padding: 10px 20px; border-radius: 20px; display: inline-block; backdrop-filter: blur(10px);">
                It's just fun ya'll
            </p>
        </footer>
    </div>
</body>
</html>
